version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orbito_postgres
    environment:
      POSTGRES_USER: orbito_user
      POSTGRES_PASSWORD: orbito_password
      POSTGRES_DB: orbito_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbito_user -d orbito_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbito_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
